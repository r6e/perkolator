# Minor and patch version updates for Python packages and for actions arrive
# as one pull request each. A major version always gets its own.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup-project
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
  # The command line tool the watcher job runs. After a bump, re-check the
  # flags in scripts/run-watcher.sh against the new version.
  - package-ecosystem: npm
    directory: /watcher
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
