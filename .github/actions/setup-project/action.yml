name: Set up project
description: >-
  Install the pinned uv and the locked dependencies. The uv cache is off so
  that no job can leave anything behind for a job with more permissions.
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        version: "0.13.9"
        enable-cache: false
    - run: uv sync --frozen
      shell: bash
